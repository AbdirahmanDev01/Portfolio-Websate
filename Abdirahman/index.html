<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" type="image/png" sizes="16x16" href="./images/Abdirahmanlogo11-01.jpg">

 <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>

  <title>Abdirahman Portfolio</title>
</head>

<body class="bg-[#020B1E] text-[#F8FAFC]">

  <nav class="bg-[#020817] border-b border-[#17233B]">
    <div class="max-w-7xl mx-auto px-6 py-4 flex items-center justify-between">

      <!-- Logo -->
      <a href="#home" class="w-10 h-10 flex items-center justify-center">
        <img src="./images/logo-01.png" alt="Abdirahman Hussein Logo" class="w-10 h-10 object-contain scale-210"
  >
</a>

      <!-- Navigation links -->
      <ul class="flex items-center gap-8">
        <li>
          <a href="#home" class="hover:text-[#13C8E8] transition duration-300">Home</a></li>
          <li><a href="#about" class="hover:text-[#13C8E8] transition duration-300">About</a></li>

        <li><a href="#projects" class="hover:text-[#13C8E8] transition duration-300">Projects</a></li>
        <li><a href="#contact" class="hover:text-[#13C8E8] transition duration-300">Contact </a> </li>
      </ul>

      <!-- Contact button -->
      <a
        href="#contact"
        class="bg-[#13C8E8] text-[#020B1E] px-5 py-2 rounded-md hover:bg-white transition duration-300"> Let’s Talk</a>

    </div>
  </nav>
  <main
  id="home"
  class="max-w-7xl mx-auto px-6 py-20"
>
  <div class="grid grid-cols-1 md:grid-cols-2 gap-12 items-center">

    <!-- Left content -->
    <div class="space-y-5">

      <p class="text-lg text-[#13C8E8]">
        Abdirahman Hussein
      </p>

      <p class="text-2xl md:text-3xl text-[#A855F7]">
        Full Stack Developer
      </p>

      <h1 class="text-4xl md:text-5xl lg:text-6xl font-bold leading-tight">
        I build clean, responsive websites.
      </h1>

      <p class="text-base md:text-lg text-[#94A3B8] leading-relaxed max-w-xl">
        I create fast, accessible and user-friendly websites using modern web technologies.
      </p>

      <div class="flex flex-col sm:flex-row gap-4">

        <a
          href="#projects"
          class="bg-[#13C8E8] text-[#020B1E] px-6 py-3 rounded-md
                 text-center hover:bg-white transition duration-300"
        >
          View My Work
        </a>

        <a
          href="./Abdirahman-Hussein-CV.pdf"
          download
          class="border border-[#A855F7] text-white px-6 py-3 rounded-md
                 text-center hover:bg-[#A855F7] transition duration-300">Download CV</a></div>
    </div>

    <!-- Right content -->
    <div class="flex justify-center md:justify-end">
      <img
        src="./images/picture 02.png"
        alt="Portrait of Abdirahman Hussein"
        class="w-full max-w-md aspect-[4/5] object-cover rounded-2xl
               border-2 border-[#13C8E8]"
      >
    </div>

  </div>
</main>

</body>
</html>
